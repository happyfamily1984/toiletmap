name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        # 저장소 Settings > Secrets and variables > Actions > Variables 에 WEB_URL 을 넣으면 그 주소로 빌드됨
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          chmod +x gradlew
          if [ -n "$WEB_URL" ]; then
            ./gradlew assembleRelease "-Ptoiletmap.webUrl=$WEB_URL"
          else
            ./gradlew assembleRelease
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: salddeul-toiletmap-apk
          path: android/app/build/outputs/apk/release/*.apk
