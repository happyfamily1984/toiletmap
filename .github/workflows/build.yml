name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        # 저장소 Settings > Secrets and variables > Actions > Variables 에 WEB_URL 을 넣으면 그 주소로 빌드됨
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: |
          chmod +x gradlew
          if [ -n "$WEB_URL" ]; then
            ./gradlew assembleRelease "-Ptoiletmap.webUrl=$WEB_URL" "-Ptoiletmap.versionCode=${{ github.run_number }}"
          else
            ./gradlew assembleRelease "-Ptoiletmap.versionCode=${{ github.run_number }}"
          fi
          cp app/build/outputs/apk/release/app-release.apk salddeul-toiletmap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: salddeul-toiletmap-apk
          path: android/salddeul-toiletmap.apk
      - name: Publish APK release (main only)
        # 멤버 배포용 고정 링크:
        # https://github.com/<owner>/<repo>/releases/latest/download/salddeul-toiletmap.apk
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.WEB_URL != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" salddeul-toiletmap.apk \
            --repo "${{ github.repository }}" \
            --title "안양 과천 화장실맵 v1.0.${{ github.run_number }}" \
            --notes "안드로이드 앱 (서버 주소: ${{ vars.WEB_URL }})" \
            --latest
