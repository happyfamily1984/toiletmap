<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>살뜰 화장실맵 점검</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 16px; color: #1d2420; background: #fff; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    li { margin: 6px 0; line-height: 1.4; word-break: break-all; }
    .ok { color: #16794f; } .bad { color: #d64545; } .wait { color: #6b7570; }
    #map { width: 100%; height: 220px; border: 1px solid #ccc; margin-top: 12px; }
    .tip { background: #f4f6f5; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <h1>살뜰 화장실맵 지도 점검</h1>
  <ul id="out"></ul>
  <div id="map"></div>
  <div class="tip" id="tip" hidden></div>
  <script>
    (function () {
      var out = document.getElementById('out');
      var problems = [];
      function log(cls, text) {
        var li = document.createElement('li');
        li.className = cls;
        li.textContent = (cls === 'ok' ? '✅ ' : cls === 'bad' ? '❌ ' : '⏳ ') + text;
        out.appendChild(li);
        return li;
      }
      function tip(html) {
        var t = document.getElementById('tip');
        t.innerHTML = html;
        t.hidden = false;
      }
      window.addEventListener('error', function (e) {
        log('bad', '스크립트 오류: ' + (e.message || '알 수 없음'));
      });

      log('ok', '이 페이지 주소(네이버에 등록해야 할 주소): ' + location.origin);

      fetch('/api/config').then(function (r) { return r.json(); }).then(function (cfg) {
        var id = cfg.naverClientId || '';
        if (!id) {
          log('bad', '서버에 NAVER_MAP_CLIENT_ID 가 비어 있음');
          tip('Render → Environment 에서 <b>NAVER_MAP_CLIENT_ID</b> 를 넣어 주세요.');
          return;
        }
        log('ok', 'Client ID: ' + id.slice(0, 4) + '…' + id.slice(-2) + ' (길이 ' + id.length + ')');
        if (/\s/.test(id)) log('bad', 'Client ID 에 공백/줄바꿈이 들어 있음');

        var authFailed = false;
        window.navermap_authFailure = function () {
          authFailed = true;
          log('bad', '네이버 지도 인증 실패 (navermap_authFailure)');
          tip('네이버 클라우드 콘솔 → Maps → Application → [수정]에서 확인:<br>' +
            '1) <b>Dynamic Map</b> 체크<br>' +
            '2) Web 서비스 URL 에 <b>' + location.origin + '</b> 등록<br>' +
            '3) Render 의 NAVER_MAP_CLIENT_ID 가 <b>Client ID</b> 인지 (Client Secret 아님)');
        };

        var loading = log('wait', '네이버 지도 스크립트 불러오는 중…');
        var s = document.createElement('script');
        s.src = 'https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=' + encodeURIComponent(id) + '&submodules=geocoder';
        s.onerror = function () {
          loading.className = 'bad';
          loading.textContent = '❌ 네이버 지도 스크립트를 불러오지 못함 (인터넷/차단 문제)';
        };
        s.onload = function () {
          loading.className = 'ok';
          loading.textContent = '✅ 네이버 지도 스크립트 불러옴' +
            (window.naver && naver.maps && naver.maps.VERSION ? ' (v' + naver.maps.VERSION + ')' : '');
          if (!window.naver || !naver.maps) {
            log('bad', 'naver.maps 가 없음');
            return;
          }
          try {
            new naver.maps.Map('map', { center: new naver.maps.LatLng(37.4292, 126.9876), zoom: 15 });
            log('ok', '지도 객체 생성됨 (아래 상자에 과천시청 주변 지도가 보여야 정상)');
          } catch (err) {
            log('bad', '지도 생성 오류: ' + err.message);
          }

          var geoStarted = false;
          function testGeocoder() {
          if (geoStarted) return;
          geoStarted = true;
          var S = naver.maps.Service;
          if (!S || !S.reverseGeocode) {
            log('bad', 'geocoder 모듈 없음');
          } else {
            var g = log('wait', '주소 변환(Reverse Geocoding) 시험 중…');
            S.reverseGeocode({ coords: new naver.maps.LatLng(37.4292, 126.9876) }, function (status, res) {
              if (status === S.Status.OK) {
                var a = res && res.v2 && res.v2.address;
                g.className = 'ok';
                g.textContent = '✅ 주소 변환 성공: ' + ((a && (a.roadAddress || a.jibunAddress)) || '(주소 없음)');
              } else {
                g.className = 'bad';
                g.textContent = '❌ 주소 변환 실패 (status ' + status + ') → Geocoding / Reverse Geocoding 체크 확인';
              }
            });
          }
          }
          // geocoder 서브모듈은 maps.js 뒤에 따로 불러와진다
          if (naver.maps.Service && naver.maps.Service.reverseGeocode) testGeocoder();
          else {
            naver.maps.onJSContentLoaded = testGeocoder;
            setTimeout(testGeocoder, 5000);
          }

          setTimeout(function () {
            var imgs = document.querySelectorAll('#map img, #map canvas').length;
            if (imgs > 0 && !authFailed) log('ok', '지도 그림 ' + imgs + '개 표시됨');
            else if (!authFailed) {
              log('bad', '5초가 지나도 지도 그림이 없음');
              tip('네이버 클라우드 콘솔 → Maps → Application → [수정]에서 <b>Dynamic Map</b> 체크와 ' +
                'Web 서비스 URL <b>' + location.origin + '</b> 을 확인해 주세요. 수정 후 몇 분 뒤 다시 열어 보세요.');
            }
          }, 5000);
        };
        document.head.appendChild(s);
      }).catch(function () {
        log('bad', '서버(/api/config)에 연결 실패');
      });
    })();
  </script>
</body>
</html>
