<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f9d6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="안양 과천 화장실맵" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="과천·안양·의왕 화장실 위치와 비밀번호를 공유하는 안양 과천 화장실맵" />
  <!-- 메신저(카카오톡·텔레그램 등) 링크 미리보기 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="안양 과천 화장실맵" />
  <meta property="og:title" content="안양 과천 화장실맵" />
  <meta property="og:description" content="과천·안양·의왕 화장실 위치와 비밀번호를 공유하는 안양 과천 화장실맵" />
  <meta property="og:image" content="/icons/icon-512.png" />
  <title>안양 과천 화장실맵</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 편집 코드 입력 (화장실 등록·수정할 때만, 지도 위에 뜸) -->
  <section id="login" class="login" hidden role="dialog" aria-modal="true" aria-labelledby="login-title">
    <button id="login-close" class="login-close" type="button" aria-label="닫기">✕</button>
    <div class="login-inner">
      <img class="login-logo" src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1 id="login-title">편집 코드 입력</h1>
      <p class="login-sub">화장실을 등록·수정하려면 코드 4자리를 입력하세요</p>
      <div class="pin-dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <input id="pin-input" class="sr-only" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="편집 코드" />
      <p id="login-error" class="login-error" role="alert"></p>
      <div class="keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <span></span>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="back" aria-label="지우기">⌫</button>
      </div>
    </div>
  </section>

  <!-- 지도 화면 -->
  <section id="main" class="main" hidden>
    <div id="map" class="map"></div>

    <header class="topbar">
      <button id="near-btn" class="near-btn" type="button" aria-label="내 근처 화장실"><span>📍</span>내 근처</button>
      <button id="menu-btn" class="icon-btn" type="button" aria-label="메뉴">☰</button>
      <div id="menu" class="menu" hidden>
        <div class="menu-title">안양 과천 화장실맵</div>
        <button type="button" data-region="gwacheon">과천으로 이동</button>
        <button type="button" data-region="anyang">안양으로 이동</button>
        <button type="button" data-region="uiwang">의왕으로 이동</button>
        <button type="button" id="admin-btn">관리자</button>
        <a class="menu-link" href="/privacy.html" target="_blank" rel="noopener">개인정보처리방침</a>
        <button type="button" id="logout-btn" hidden>편집 모드 끝내기</button>
        <div class="menu-credit">권역 경계: 통계청 SGIS(공공누리 제1유형), vuski/admdongkor<br>걷는 길 경로: © OpenStreetMap contributors, FOSSGIS 경로 서비스</div>
      </div>
    </header>

    <div id="hint" class="hint">＋ 화장실 등록 버튼을 눌러 화장실을 추가할 수 있어요</div>

    <!-- 내 위치: 왼쪽 맨 아래 -->
    <button id="locate-btn" class="fab locate-btn" type="button" aria-label="내 위치">◎</button>

    <div class="fabs">
      <!-- 배민플러스 버튼을 누르면 권역·프로모션·가입신청 버튼이 열리고, 다시 누르면 닫힘 -->
      <div id="bm-panel" class="bm-panel" hidden>
        <!-- 권역 표시 (과천B 남색 / 동안A 분홍, 한 번에 하나만) -->
        <div class="promo-row">
          <button id="zone-btn" class="zone-btn" type="button" aria-label="과천B 권역 보기">과천B<small>권역</small></button>
          <button id="finish-btn" class="zone-btn finish" type="button" aria-label="동안A 권역 보기">동안A<small>권역</small></button>
        </div>
        <div class="promo-row">
          <button type="button" class="promo-btn" data-promo="gwacheon-b.jpg?v=3" data-title="배민플러스 살뜰 과천B 프로모션">과천B<small>프로모션</small></button>
          <button type="button" class="promo-btn finish" data-promo="dongan-a.jpg?v=3" data-title="배민플러스 피니시 동안A 프로모션">동안A<small>프로모션</small></button>
        </div>
        <!-- 배민플러스 가입신청: 누르면 신청서 (신청서 안에 전화 연결 버튼) -->
        <button id="join-btn" class="join-btn" type="button">가입신청</button>
      </div>
      <button id="bm-btn" class="bm-btn" type="button" aria-expanded="false" aria-controls="bm-panel">배민플러스<span class="arrow">▲</span></button>
      <button id="add-btn" class="add-btn" type="button">＋ 화장실 등록</button>
    </div>

    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
    <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheet-body"></div>
    </div>

    <div id="promo" class="promo" hidden role="dialog" aria-modal="true">
      <div class="promo-box">
        <button type="button" class="promo-close" aria-label="닫기">✕</button>
        <img id="promo-img" alt="" />
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="ad-bar" class="ad-bar" hidden></div>
  </section>

  <div id="fatal" class="fatal" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
