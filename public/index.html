<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1f9d6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="안양 과천 화장실맵" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="description" content="과천·안양·의왕 화장실 위치와 비밀번호를 공유하는 안양 과천 화장실맵" />
  <!-- 메신저(카카오톡·텔레그램 등) 링크 미리보기 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="안양 과천 화장실맵" />
  <meta property="og:title" content="안양 과천 화장실맵" />
  <meta property="og:description" content="과천·안양·의왕 화장실 위치와 비밀번호를 공유하는 안양 과천 화장실맵" />
  <meta property="og:image" content="/icons/icon-512.png" />
  <title>안양 과천 화장실맵</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 편집 코드 입력 (화장실 등록·수정할 때만, 지도 위에 뜸) -->
  <section id="login" class="login" hidden role="dialog" aria-modal="true" aria-labelledby="login-title">
    <button id="login-close" class="login-close" type="button" aria-label="닫기">✕</button>
    <div class="login-inner">
      <img class="login-logo" src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1 id="login-title">편집 코드 입력</h1>
      <p class="login-sub">화장실을 등록·수정하려면 코드 4자리를 입력하세요</p>
      <div class="pin-dots" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
      <input id="pin-input" class="sr-only" type="tel" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="편집 코드" />
      <p id="login-error" class="login-error" role="alert"></p>
      <div class="keypad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <span></span>
        <button type="button" data-key="0">0</button>
        <button type="button" data-key="back" aria-label="지우기">⌫</button>
      </div>
    </div>
  </section>

  <!-- 지도 화면 -->
  <section id="main" class="main" hidden>
    <div id="map" class="map"></div>

    <header class="topbar">
      <button id="near-btn" class="near-btn" type="button" aria-label="내 근처 화장실"><span class="pin-emoji">📍</span>내 근처</button>
      <button id="menu-btn" class="icon-btn" type="button" aria-label="메뉴">
        <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      </button>
      <div id="menu" class="menu" hidden>
        <div class="menu-head">
          <span class="menu-logo"><svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="7" cy="4.6" r="2.1"/><path d="M5 8.2h4a1.2 1.2 0 0 1 1.2 1.2V15H8.7v6H5.3v-6H3.8V9.4A1.2 1.2 0 0 1 5 8.2z"/><rect x="11.4" y="3" width="1.2" height="18" rx=".6"/><circle cx="17" cy="4.6" r="2.1"/><path d="M15.1 8.2h3.8l2.4 7.3h-2.3V21h-1.7v-4.6h-.6V21H15v-5.5h-2.3z"/></svg></span>
          <span class="menu-title">안양 과천 화장실맵</span>
          <button type="button" id="menu-close" class="menu-close" aria-label="메뉴 닫기">
            <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <button type="button" id="admin-btn" class="menu-item">
          <svg class="ico green" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          <span>관리자</span><svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <a class="menu-item" href="/privacy.html" target="_blank" rel="noopener">
          <svg class="ico green" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3zm-1.2 14.2-3.5-3.5 1.4-1.4 2.1 2.1 4.9-4.9 1.4 1.4-6.3 6.3z"/></svg>
          <span>개인정보처리방침</span><svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <button type="button" id="logout-btn" class="menu-item" hidden>
          <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M9.5 12.5h7M9.5 16h7"/></svg>
          <span>편집 모드 끝내기</span><svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div class="menu-credit">
          <svg class="ico green" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
          <span>권역 경계: 통계청 SGIS(공공누리 제1유형), vuski/admdongkor<br>걷는 길 경로: © OpenStreetMap contributors, FOSSGIS 경로 서비스</span>
        </div>
      </div>
    </header>

    <div id="hint" class="hint">＋ 화장실 등록 버튼을 눌러 화장실을 추가할 수 있어요</div>

    <!-- 내 위치: 왼쪽 맨 아래 -->
    <button id="locate-btn" class="fab locate-btn" type="button" aria-label="내 위치">
      <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
    </button>

    <div class="fabs">
      <!-- 배민플러스 버튼을 누르면 권역·프로모션·가입신청 버튼이 열리고, 다시 누르면 닫힘 -->
      <div id="bm-panel" class="bm-panel" hidden>
        <!-- 권역 표시 (과천B 남색 / 동안A 분홍, 한 번에 하나만) -->
        <div class="promo-row">
          <button id="zone-btn" class="zone-btn" type="button" aria-label="과천B 권역 보기"><svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="7" cy="4.6" r="2.1"/><path d="M5 8.2h4a1.2 1.2 0 0 1 1.2 1.2V15H8.7v6H5.3v-6H3.8V9.4A1.2 1.2 0 0 1 5 8.2z"/><rect x="11.4" y="3" width="1.2" height="18" rx=".6"/><circle cx="17" cy="4.6" r="2.1"/><path d="M15.1 8.2h3.8l2.4 7.3h-2.3V21h-1.7v-4.6h-.6V21H15v-5.5h-2.3z"/></svg>과천B<small>권역</small></button>
          <button id="finish-btn" class="zone-btn finish" type="button" aria-label="동안A 권역 보기"><svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><circle cx="7" cy="4.6" r="2.1"/><path d="M5 8.2h4a1.2 1.2 0 0 1 1.2 1.2V15H8.7v6H5.3v-6H3.8V9.4A1.2 1.2 0 0 1 5 8.2z"/><rect x="11.4" y="3" width="1.2" height="18" rx=".6"/><circle cx="17" cy="4.6" r="2.1"/><path d="M15.1 8.2h3.8l2.4 7.3h-2.3V21h-1.7v-4.6h-.6V21H15v-5.5h-2.3z"/></svg>동안A<small>권역</small></button>
        </div>
        <div class="promo-row">
          <button type="button" class="promo-btn" data-promo="gwacheon-b.jpg?v=3" data-title="배민플러스 살뜰 과천B 프로모션"><svg class="crown-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="#ffd21f"><path d="M3 8l4.6 4L12 5l4.4 7L21 8l-2 10H5z"/></svg>과천B<small>프로모션</small></button>
          <button type="button" class="promo-btn finish" data-promo="dongan-a.jpg?v=3" data-title="배민플러스 피니시 동안A 프로모션"><svg class="crown-ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="#ffd21f"><path d="M3 8l4.6 4L12 5l4.4 7L21 8l-2 10H5z"/></svg>동안A<small>프로모션</small></button>
        </div>
        <!-- 배민플러스 가입신청: 누르면 신청서 (신청서 안에 전화 연결 버튼) -->
        <button id="join-btn" class="join-btn" type="button">
          <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.7-4.9 4.5 1.4 6.6L12 17l-6 3.4 1.4-6.6-4.9-4.5 6.6-.7z"/></svg>
          가입신청<svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
      <button id="bm-btn" class="bm-btn" type="button" aria-expanded="false" aria-controls="bm-panel">
        <svg class="ico" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2.5 8 12 13l9.5-5z" fill="currentColor"/><path d="M2.5 12 12 17l9.5-5M2.5 16 12 21l9.5-5"/></svg>
        배민플러스<span class="arrow">▲</span>
      </button>
      <button id="add-btn" class="add-btn" type="button"></button>
    </div>

    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
    <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheet-body"></div>
    </div>

    <div id="promo" class="promo" hidden role="dialog" aria-modal="true">
      <div class="promo-box">
        <button type="button" class="promo-close" aria-label="닫기">✕</button>
        <img id="promo-img" alt="" />
      </div>
    </div>

    <div id="toast" class="toast" hidden></div>
    <div id="ad-bar" class="ad-bar" hidden></div>
  </section>

  <div id="fatal" class="fatal" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
