<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1086px;height:1448px;font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;color:#fff;position:relative;overflow:hidden;
 background:
  radial-gradient(ellipse at 85% 92%,rgba(255,166,77,.55),transparent 45%),
  radial-gradient(ellipse at 10% 0%,rgba(46,230,197,.25),transparent 40%),
  linear-gradient(175deg,#0b1626 0%,#14304a 45%,#2a3f63 70%,#5b4a6b 100%)}
.speed{position:absolute;left:-10%;width:120%;height:3px;background:linear-gradient(90deg,transparent,rgba(120,220,255,.7),transparent);transform:rotate(-8deg)}
.city{position:absolute;bottom:0;left:0;right:0;height:300px;
 background:linear-gradient(0deg,#0b1626 0%,rgba(11,22,38,.0) 100%),
 repeating-linear-gradient(90deg,rgba(10,18,32,.95) 0 38px,rgba(10,18,32,.0) 38px 52px,rgba(10,18,32,.85) 52px 96px,rgba(10,18,32,0) 96px 120px);
 -webkit-mask:linear-gradient(0deg,#000 40%,transparent 100%);opacity:.9}
.wrap{position:relative;padding:44px 48px}
.top{display:flex;gap:28px}
.left{flex:1}
.logo{display:flex;align-items:center;gap:16px}
.mark{width:104px;height:104px;border-radius:50%;background:#fff;color:#0b1626;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:46px;font-style:italic;border:6px solid #ff3d8b;letter-spacing:-3px}
.brand b{display:block;font-size:52px;font-weight:900;font-style:italic;letter-spacing:1px;line-height:1}
.brand small{display:block;font-size:20px;letter-spacing:5px;font-weight:700;color:#bfe9e1;margin-top:6px}
.brush{position:relative;display:inline-block;padding:10px 36px 14px;margin-top:22px}
.brush::before{content:"";position:absolute;inset:0;background:#ff1f7a;transform:skew(-8deg) rotate(-2deg);border-radius:6px 22px 8px 26px;
 box-shadow:14px 6px 0 -4px rgba(255,31,122,.55),-10px -4px 0 -6px rgba(255,31,122,.4)}
.brush span{position:relative;font-size:112px;font-weight:900;letter-spacing:-3px;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.chips{margin-top:24px;border:4px solid #7ff0d8;border-radius:22px;background:rgba(10,90,90,.55);box-shadow:0 0 18px rgba(127,240,216,.5);
 display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.chips div{padding:16px 6px;text-align:center;font-size:36px;font-weight:900;white-space:nowrap}
.chips div:nth-child(1),.chips div:nth-child(2){border-bottom:3px solid rgba(255,255,255,.7)}
.chips div:nth-child(odd){border-right:3px solid rgba(255,255,255,.7)}
.chips em{font-style:normal;color:#ffe14d}
.map{width:360px;flex:none;background:#fff;border-radius:18px;padding:14px 14px 10px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.map .ttl{color:#14202a;font-weight:900;font-size:24px;text-align:center;margin-bottom:6px}
.legend{display:flex;justify-content:space-around;margin-top:8px;color:#14202a;font-size:20px;font-weight:800}
.legend i{display:inline-block;width:26px;height:20px;border-radius:4px;vertical-align:-3px;margin-right:6px}
.card{position:relative;margin-top:30px;background:#fff;border-radius:26px;padding:30px 30px 26px;color:#14202a;box-shadow:0 14px 30px rgba(0,0,0,.35)}
.head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.blk{background:#14202a;color:#fff;font-size:44px;font-weight:900;padding:8px 22px;transform:rotate(-1.5deg);border-radius:6px;letter-spacing:-1px}
.pk{background:#ff1f7a;color:#fff;font-size:52px;font-weight:900;padding:4px 22px;transform:rotate(-1.5deg);border-radius:6px;letter-spacing:-1px}
.tiers{display:flex;flex-direction:column;gap:16px;margin-top:24px}
.tier{display:flex;align-items:stretch;border-radius:12px;overflow:hidden;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.tier .c{background:#ff1f7a;color:#fff;font-size:44px;padding:12px 22px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.tier .c small{font-size:26px}
.tier .f{background:#eef3f2;flex:1;font-size:30px;padding:12px 20px;display:flex;align-items:center;color:#334}
.tier .m{background:#ffe14d;font-size:50px;padding:12px 24px;display:flex;align-items:center;white-space:nowrap;letter-spacing:-1px}
.tier.gold .c{background:#d99a00}
.tier.gold .m{background:linear-gradient(135deg,#fff3a8,#ffcf2e)}
.unl{display:inline-block;background:#ff1f7a;color:#fff;font-size:26px;padding:4px 12px;border-radius:8px;margin-left:10px;vertical-align:middle}
.burst{margin:26px -10px 0;position:relative;text-align:center;padding:16px 0 20px}
.burst::before{content:"";position:absolute;inset:0;background:#ff1f7a;transform:skew(-10deg) rotate(-1.5deg);border-radius:10px 30px 10px 30px}
.burst span{position:relative;font-size:56px;font-weight:900;color:#ffe14d;letter-spacing:-1px;text-shadow:3px 3px 0 #14202a,-2px -2px 0 #14202a,2px -2px 0 #14202a,-2px 2px 0 #14202a}
.burst span b{color:#fff}
.checks{display:grid;grid-template-columns:1fr;gap:14px;margin-top:26px;padding-top:22px;border-top:3px dashed #d6e4e1}
.checks div{display:flex;align-items:center;gap:14px;font-size:36px;font-weight:900}
.checks i{flex:none;width:46px;height:46px;border-radius:50%;background:#1aa37a;color:#fff;font-style:normal;display:flex;align-items:center;justify-content:center;font-size:30px}
.checks em{font-style:normal;color:#ff1f7a}
.foot{position:absolute;left:48px;right:48px;bottom:46px;text-align:right}
.foot .s1{font-size:58px;font-weight:900;font-style:italic;color:#ffe14d;text-shadow:3px 3px 0 #14202a;transform:rotate(-4deg);display:inline-block}
.foot .s2{margin-top:12px;font-size:26px;font-weight:800;color:#fff}
.foot .tag{display:inline-block;margin-top:14px;position:relative;padding:8px 30px}
.foot .tag::before{content:"";position:absolute;inset:0;background:#2ee6c5;transform:skew(-12deg) rotate(-3deg);border-radius:6px}
.foot .tag span{position:relative;font-size:56px;font-weight:900;font-style:italic;color:#fff;text-shadow:3px 3px 0 #14202a}
</style></head><body>
