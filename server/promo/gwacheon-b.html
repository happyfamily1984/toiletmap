<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;font-family:"Noto Sans CJK KR","Noto Sans KR",sans-serif;
 background:linear-gradient(160deg,#0f2b3d 0%,#123f4f 55%,#0d5a55 100%);color:#fff;position:relative;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(10px);opacity:.25}
.g1{width:520px;height:520px;background:#2ee6c5;right:-160px;top:-160px}
.g2{width:420px;height:420px;background:#ffd25a;left:-180px;bottom:-140px;opacity:.18}
.wrap{position:relative;padding:64px 72px 0}
.tag{display:inline-block;background:#2ee6c5;color:#0f2b3d;font-weight:900;font-size:34px;padding:12px 26px;border-radius:999px;letter-spacing:1px}
h1{font-size:92px;font-weight:900;line-height:1.1;margin-top:24px;letter-spacing:-2px}
h1 em{font-style:normal;color:#ffd25a}
.sub{font-size:36px;color:#bfe9e1;margin-top:14px;font-weight:700}
.cards{margin-top:40px;display:flex;flex-direction:column;gap:26px}
.card{background:#fff;color:#0f2b3d;border-radius:34px;padding:36px 44px;display:flex;align-items:center;gap:34px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.card .lv{flex:none;width:260px;white-space:nowrap;text-align:center;border-right:3px dashed #d6e4e1;padding-right:30px}
.lv .n{font-size:84px;font-weight:900;line-height:1;color:#0d8f7f}
.lv .n small{font-size:40px}
.lv .t{font-size:30px;font-weight:800;color:#567;margin-top:6px}
.card .bd .a{font-size:32px;font-weight:700;color:#567}
.card .bd .b{font-size:64px;font-weight:900;line-height:1.15;letter-spacing:-1px}
.card .bd .b .won{color:#e2441f}
.card.gold{background:linear-gradient(135deg,#fff7d6,#ffe08a)}
.card.gold .lv .n{color:#b07600}
.badge{display:inline-block;background:#e2441f;color:#fff;font-size:30px;font-weight:900;padding:6px 18px;border-radius:12px;margin-left:10px;vertical-align:middle}
.free{margin-top:34px;border:3px solid #2ee6c5;border-radius:34px;padding:32px 44px;background:rgba(46,230,197,.08)}
.free h2{font-size:44px;font-weight:900;color:#2ee6c5}
.free li{list-style:none;font-size:40px;font-weight:800;margin-top:18px;display:flex;align-items:center;gap:18px}
.free li i{font-style:normal;flex:none;width:52px;height:52px;border-radius:50%;background:#2ee6c5;color:#0f2b3d;display:flex;align-items:center;justify-content:center;font-size:34px}
.free li b{color:#ffd25a}
.foot{position:absolute;left:72px;right:72px;bottom:48px;display:flex;justify-content:space-between;font-size:30px;color:#9fd3ca;font-weight:700}
</style></head><body>
<div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
 <span class="tag">배민플러스 · 살뜰 과천B</span>
 <h1>과천B <em>프로모션</em></h1>
 <p class="sub">많이 탈수록 건당 단가가 올라갑니다</p>
 <div class="cards">
  <div class="card">
   <div class="lv"><div class="n">101<small>건</small></div><div class="t">달성 시</div></div>
   <div class="bd"><div class="a">101건째부터 추가 지급</div><div class="b">건당 <span class="won">+1,000원</span></div></div>
  </div>
  <div class="card gold">
   <div class="lv"><div class="n">250<small>건</small></div><div class="t">달성 시</div></div>
   <div class="bd"><div class="a">101건째부터 추가 지급</div><div class="b">건당 <span class="won">+1,300원</span><span class="badge">무제한</span></div></div>
  </div>
 </div>
 <div class="free">
  <h2>콜 거절 자유</h2>
  <ul>
   <li><i>✓</i><span>권역 외 콜 <b>무제한 거절 가능</b></span></li>
   <li><i>✓</i><span>밤 12시 ~ 오전 9시 콜 <b>무제한 거절 가능</b></span></li>
  </ul>
 </div>
</div>
<div class="foot"><span>배민플러스 살뜰 과천B</span><span>PROMOTION</span></div>
</body></html>
